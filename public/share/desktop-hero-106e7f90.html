<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Первый экран Sensay</title>
<link rel="icon" href="/favicon.svg">
<style>
  :root { --text: #111; --muted: #666; --line: #e5e1da; --bg: #fff; --accent: #FF4122; --soft: #f6f4f0; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 28px; line-height: 1.2; margin: 0 0 8px; }
  h2 { font-size: 21px; margin: 40px 0 12px; padding-top: 16px; border-top: 1px solid var(--line); }
  h3 { font-size: 17px; margin: 28px 0 8px; color: var(--accent); }
  table { display: block; overflow-x: auto; border-collapse: collapse; margin: 16px 0; font-size: 15px; }
  th, td { border: 1px solid var(--line); padding: 8px 10px; text-align: left; vertical-align: top; }
  th { background: var(--soft); }
  pre { background: var(--soft); padding: 14px 16px; overflow-x: auto; font-size: 13px; line-height: 1.45; border-radius: 8px; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  ul { padding-left: 22px; }
  li { margin: 4px 0; }
  .error { color: var(--muted); }
</style>
</head>
<body>
<main id="doc">Загрузка…</main>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script>
  // Render the markdown file that sits next to this page.
  const src = "desktop-hero-106e7f90.md";
  const doc = document.getElementById("doc");
  fetch(src)
    .then((r) => { if (!r.ok) throw new Error(String(r.status)); return r.text(); })
    .then((md) => {
      doc.innerHTML = marked.parse(md);
      const h1 = doc.querySelector("h1");
      if (h1) document.title = h1.textContent;
    })
    .catch(() => {
      doc.innerHTML = '<p class="error">Не удалось загрузить текст. <a href="' + src + '">Открыть файл</a></p>';
    });
</script>
</body>
</html>
